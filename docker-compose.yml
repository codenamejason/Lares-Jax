services:
  letta:
    image: letta/letta:latest
    ports:
      - "8283:8283"
    volumes:
      - letta-data:/var/lib/postgresql/data
    environment:
      - OPENAI_API_BASE=http://192.168.1.77:7777/v1
      - OPENAI_API_KEY=lm-studio
    restart: unless-stopped
    networks:
      - lares-network

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8765:8765"
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}
      - LETTA_BASE_URL=http://letta:8283
      - LARES_PROJECT_PATH=${LARES_PROJECT_PATH:-/app}
      - OBSIDIAN_VAULT_PATH=${OBSIDIAN_VAULT_PATH}
      - LARES_APPROVAL_DB=${LARES_APPROVAL_DB:-/app/data/approvals.db}
      - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://192.168.1.77:7777/v1}
      - LARES_MODEL=${LARES_MODEL}
      - BLUESKY_HANDLE=jaxcoder.bsky.social
      - BLUESKY_APP_PASSWORD=${BLUESKY_APP_PASSWORD}
      - BLUESKY_SESSION_TOKEN=${BLUESKY_SESSION_TOKEN}
      - GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID}
      - GOOGLE_CALENDAR_CLIENT_SECRET=${GOOGLE_CALENDAR_CLIENT_SECRET}
      - GOOGLE_CALENDAR_TOKEN_JSON=${GOOGLE_CALENDAR_TOKEN_JSON}
    depends_on:
      letta:
        condition: service_started
    restart: unless-stopped
    networks:
      - lares-network
    volumes:
      - ./data:/app/data
      - "/Users/jaxcoder/Desktop/Obsidian Jax Labs/Jax Labs:/obsidian"

  lares-bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}
      - LETTA_BASE_URL=http://letta:8283
      - LARES_MCP_URL=http://mcp-server:8765
      - LARES_AGENT_ID=${LARES_AGENT_ID}
      - USER_TIMEZONE=${USER_TIMEZONE:-America/Los_Angeles}
      - LARES_MAX_TOOL_ITERATIONS=${LARES_MAX_TOOL_ITERATIONS:-10}
      - LARES_CONTEXT_WINDOW_LIMIT=${LARES_CONTEXT_WINDOW_LIMIT:-30000}
      - LARES_CONTEXT_MONITORING=${LARES_CONTEXT_MONITORING:-false}
      - LARES_MODEL=${LARES_MODEL}
      - OBSIDIAN_VAULT_PATH=${OBSIDIAN_VAULT_PATH}
      - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://192.168.1.77:7777/v1}
      - BLUESKY_HANDLE=jaxcoder.bsky.social
      - BLUESKY_APP_PASSWORD=${BLUESKY_APP_PASSWORD}
      - BLUESKY_SESSION_TOKEN=${BLUESKY_SESSION_TOKEN}
      - GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID}
      - GOOGLE_CALENDAR_CLIENT_SECRET=${GOOGLE_CALENDAR_CLIENT_SECRET}
      - GOOGLE_CALENDAR_TOKEN_JSON=${GOOGLE_CALENDAR_TOKEN_JSON}
    depends_on:
      letta:
        condition: service_started
      mcp-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - lares-network
    volumes:
      - "/Users/jaxcoder/Desktop/Obsidian Jax Labs/Jax Labs:/obsidian"

volumes:
  letta-data:

networks:
  lares-network:
    driver: bridge
